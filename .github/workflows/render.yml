# Redraws the live pulse panel once a day and publishes it as a single orphan commit on the
# `output` branch, which the README reads from raw.githubusercontent.com. The static panels in
# assets/ are committed by hand and never depend on this workflow. Free on a public repo.
name: render-profile
on:
  schedule:
    - cron: "23 9 * * *"          # daily, off the top of the hour
  push:
    branches: [master]            # the default branch is master, not main
    paths: [".github/workflows/render.yml", "scripts/**", "data/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-profile
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node scripts/check.mjs
      - run: node scripts/build-assets.mjs --live --out dist
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: publish dist as one orphan commit on output
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "render $(date -u +%F)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
